name: Deploy to Firebase Hosting
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: koolab-33917
      # Firestore 보안 규칙도 함께 배포합니다 (firestore.rules 수정이 콘솔
      # 수동 게시 없이 반영되도록). 서비스 계정에 "Firebase Rules 관리자"
      # 역할이 없으면 403으로 실패하는데, 이때는 경고만 남기고 워크플로는
      # 성공 처리합니다 — 규칙은 콘솔에서 수동 게시가 필요합니다.
      - name: Deploy Firestore rules
        continue-on-error: true
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project koolab-33917 --non-interactive
