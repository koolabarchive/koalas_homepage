<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지 | 한신대학교 임상심리 연구실</title>
  <meta name="color-scheme" content="light dark" />
  <!-- 저장된 테마를 첫 페인트 전에 적용해 깜빡임을 막습니다. -->
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img class="brand-mark light" src="img/logo-hanshin.svg" alt="한신대학교" width="40" height="40" /><img class="brand-mark dark" src="img/logo-hanshin-dark.svg" alt="" aria-hidden="true" width="40" height="40" />
        <span class="brand-name">한신대학교 심리학과 연구실<small>구훈정 교수님 연구실</small></span>
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="gnb" aria-label="주 메뉴">
        <a href="notice.html">공지</a>
        <a href="research.html">연구</a>
        <a href="publications.html">성과</a>
        <a href="login.html" class="btn-login">멤버 로그인</a>
      </nav>
    </div>
  </header>

  <section class="page-head">
    <div class="container">
      <span class="eyebrow" id="pg-eyebrow">Page</span>
      <h1 id="pg-title">불러오는 중…</h1>
      <p id="pg-desc"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="w-board">
        <div class="panel-toolbar" id="pg-toolbar" style="display:none; margin-bottom:18px;">
          <span></span>
          <button class="btn-sm primary" id="btn-page-write" style="display:none;"><svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg> 글쓰기</button>
          <button class="btn-sm primary" id="btn-album-add" style="display:none;">+ 사진 추가</button>
        </div>
        <div id="pg-content">
          <p style="color:var(--muted); font-size:0.9rem; padding:12px 4px;">불러오는 중…</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 게시글 작성·수정 모달 (공지와 동일한 에디터) -->
  <div class="modal-backdrop" id="edit-modal">
    <div class="modal modal-split" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
      <div class="modal-head">
        <h3 id="edit-modal-title">새 게시글 작성</h3>
        <button type="button" class="scope-toggle" id="edit-scope-toggle" aria-pressed="false">
          <svg class="lock" viewBox="0 0 24 24" aria-hidden="true">
            <path class="lock-shackle" d="M8.2 11.2V7.9a3.8 3.8 0 0 1 7.6 0v3.3"
                  fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <rect class="lock-body" x="5.2" y="11.2" width="13.6" height="9.4" rx="2.8" fill="currentColor"/>
            <circle class="lock-hole" cx="12" cy="15.6" r="1.5"/>
          </svg>
          <span id="edit-scope-label">전체공개</span>
        </button>
        <input type="hidden" id="edit-scope" value="공개" />
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="edit-title">제목</label>
          <textarea id="edit-title" rows="1" class="compact"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="edit-author">작성자</label>
            <input type="text" id="edit-author" placeholder="이름" />
          </div>
          <div class="field" id="edit-date-field">
            <label>날짜</label>
            <div id="edit-date-dp"></div>
            <input type="hidden" id="edit-date" />
          </div>
        </div>
        <div class="field">
          <label>말머리</label>
          <div id="edit-badge-dd"></div>
          <input type="hidden" id="edit-badge" />
        </div>
        <div class="field">
          <div class="field-head">
            <span class="label-help">
              <label for="edit-content">내용</label>
              <button type="button" class="help-tip" id="edit-md-help" aria-label="마크다운 서식 안내">?</button>
            </span>
            <div class="seg" role="tablist" aria-label="내용 입력 모드">
              <button type="button" class="active" id="edit-mode-write" role="tab" aria-selected="true">쓰기</button>
              <button type="button" id="edit-mode-preview" role="tab" aria-selected="false">미리보기</button>
            </div>
          </div>
          <textarea id="edit-content" rows="8" placeholder="내용을 입력해 주세요. 마크다운을 지원합니다."></textarea>
          <div class="md-body edit-preview" id="edit-preview" hidden></div>
        </div>
        <div class="field">
          <label for="edit-files">첨부파일 <span class="hint" style="display:inline;">— 이미지·PDF·문서 등, 파일당 최대 10MB · 5개까지</span></label>
          <div class="file-list" id="edit-att-current" style="margin-bottom:8px;"></div>
          <input type="file" id="edit-files" class="file-input" multiple />
          <div class="file-list" id="edit-file-list"></div>
        </div>
        <!-- 슬라이더 노출은 공지 전용 — 커스텀 페이지에서는 숨김 -->
        <div class="field" hidden>
          <div class="check-row">
            <label class="check-line">
              <input type="checkbox" id="edit-slider" />
              <span class="check-mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-6.5"/></svg></span>
              홈 화면 최신 소식 슬라이더에 노출
            </label>
            <button type="button" class="help-tip" id="edit-slider-help" aria-label="슬라이더 노출 안내">?</button>
          </div>
        </div>
        <div class="form-msg" id="edit-msg"></div>
      </div>
      <div class="modal-foot">
        <button class="btn-sm" id="edit-cancel">취소</button>
        <button class="btn-sm primary" id="edit-save">저장</button>
      </div>
    </div>
  </div>

  <!-- 앨범: 사진 추가 모달 -->
  <div class="modal-backdrop" id="album-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="album-modal-title">
      <h3 id="album-modal-title">사진 추가</h3>
      <div class="field">
        <label for="al-files">사진 선택 <span class="hint" style="display:inline;">— 여러 장 선택 가능, 자동으로 줄여 저장됩니다</span></label>
        <input type="file" id="al-files" class="file-input" accept="image/*" multiple />
        <div class="file-list" id="al-file-list"></div>
      </div>
      <div class="field">
        <label for="al-caption">설명 (선택)</label>
        <input type="text" id="al-caption" placeholder="사진 아래에 표시되는 설명" maxlength="100" />
      </div>
      <div class="form-actions">
        <button class="btn-sm" id="al-cancel">취소</button>
        <button class="btn-sm primary" id="al-save">올리기</button>
      </div>
      <div class="form-msg" id="al-msg"></div>
    </div>
  </div>

  <!-- 앨범 라이트박스 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="닫기">✕</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="이전 사진">‹</button>
    <figure>
      <img id="lb-img" alt="" />
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-nav next" id="lb-next" aria-label="다음 사진">›</button>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <div class="f-brand">한신대학교 임상심리 연구실</div>
        <p>경기도 오산시 한신대길 137 한신대학교 심리학과<br />지도교수 구훈정 · hoonjungkoo@gmail.com</p>
      </div>
      <div class="f-links">
        <a href="research.html">연구</a>
        <a href="archive.html">자료실</a>
      </div>
    </div>
  </footer>

  <script src="js/content-store.js"></script>
  <script src="js/site-content.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/firebase-public.js"></script>
  <script type="module" src="js/page-view.js"></script>
</body>
</html>
